name: Track plugin versions

# Claude resolves a plugin's version from its repository's .claude-plugin/plugin.json,
# but only re-resolves when it re-fetches this marketplace. A plugin repo can therefore
# bump its version and no user will ever see it until this repository moves. This job
# moves it: it reads each plugin's current version and commits when one changes.
#
# Every plugin source repo is public, so the reads are anonymous HTTPS and the only
# write is to this repository via the built-in GITHUB_TOKEN. No PAT, no deploy key,
# no GitHub App, nothing to store or rotate.

on:
  schedule:
    # Hourly, at :17 to stay off the busy top of the hour.
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/marketplace.json'

concurrency:
  group: track-versions
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    name: Record published plugin versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin versions
        run: python3 .github/scripts/track-plugin-versions.py

      - name: Commit and push if changed
        run: |
          set -euo pipefail

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Stage only the state file; commit-message.txt is a scratch artifact.
          # Stage before comparing: `git diff` ignores untracked files, so on the
          # first ever run the new state file would otherwise look like no change.
          git add plugin-versions.json

          if git diff --cached --quiet -- plugin-versions.json; then
            echo "No version changes - marketplace left untouched."
            echo "No plugin version changes." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          git commit -F commit-message.txt
          git push

          echo "::notice title=Marketplace moved::Plugin versions changed - Claude will re-resolve on the next marketplace refresh"
          {
            echo "### Plugin versions updated"
            echo ""
            echo '```'
            git show --stat --oneline HEAD | head -20
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
